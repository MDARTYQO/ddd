name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

jobs:
  download-and-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yt-dlp bgutil-ytdlp-pot-provider

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start PO Token provider server
        run: |
          git clone --single-branch --branch 2.0.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          deno install --allow-scripts=npm:canvas --frozen
          deno run --allow-env --allow-net --allow-ffi=. --allow-read=. src/main.ts &
          sleep 5
          echo "POT server started"

      - name: Write cookies
        env:
          COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s' "$COOKIES" > cookies.txt
            echo "cookies.txt written"
          else
            echo "No cookies secret found"
          fi

      - name: Download and zip video
        run: |
          if [ -f cookies.txt ]; then
            yt-dlp --remote-components ejs:github \
                   --cookies cookies.txt \
                   --extractor-args "youtube:player_client=web" \
                   -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4" \
                   --merge-output-format mp4 \
                   -o video.mp4 \
                   "${{ github.event.inputs.video_url }}"
          else
            yt-dlp --remote-components ejs:github \
                   --extractor-args "youtube:player_client=web" \
                   -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4" \
                   --merge-output-format mp4 \
                   -o video.mp4 \
                   "${{ github.event.inputs.video_url }}"
          fi
          python -c "
          import zipfile, os
          with zipfile.ZipFile('video.zip', 'w') as z:
              z.write('video.mp4')
          os.remove('video.mp4')
          print('נוצר video.zip')
          "

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-zip
          path: video.zip
