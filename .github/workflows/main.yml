name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

jobs:
  download-and-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yt-dlp bgutil-ytdlp-pot-provider

      - name: Install ffmpeg if not exists
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          else
            echo "ffmpeg already installed"
          fi

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start PO Token provider server
        run: |
          git clone --single-branch --branch 2.0.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          deno install --allow-scripts=npm:canvas --frozen
          deno run --allow-env --allow-net --allow-ffi=. --allow-read=. src/main.ts &
          sleep 5
          echo "POT server started"

      - name: Download cookies.txt from repository (if exists)
        run: |
          if [ -f cookies.txt ]; then
            echo "cookies.txt found"
          else
            echo "No cookies.txt found"
          fi

      - name: Download and zip video
        run: |
          if [ -f cookies.txt ]; then
            python download_and_zip.py "${{ github.event.inputs.video_url }}" --cookies cookies.txt
          else
            python download_and_zip.py "${{ github.event.inputs.video_url }}"
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-zip
          path: video.zip
