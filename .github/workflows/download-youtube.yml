name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: YouTube video URL
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start PO Token provider
        run: |
          git clone --depth 1 --single-branch --branch 2.0.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil"

          cd "$RUNNER_TEMP/bgutil/server"
          deno install --allow-scripts=npm:canvas --frozen

          deno run --allow-env --allow-net --allow-ffi=. --allow-read=. \
            src/main.ts > "$RUNNER_TEMP/bgutil-pot-provider.log" 2>&1 &

          provider_pid=$!
          for attempt in {1..10}; do
            if ! kill -0 "$provider_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/bgutil-pot-provider.log"
              echo "PO Token provider stopped unexpectedly."
              exit 1
            fi
            sleep 1
          done

      - name: Download and zip video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail

          cookie_file="$RUNNER_TEMP/youtube-cookies.txt"
          trap 'rm -f "$cookie_file"' EXIT

          args=(
            --remote-components ejs:github
            --js-runtimes deno
            --extractor-args "youtube:player_client=mweb"
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/mp4/best"
            --merge-output-format mp4
            -o video.mp4
          )

          if [[ -n "${YOUTUBE_COOKIES:-}" ]]; then
            umask 077
            printf '%s' "$YOUTUBE_COOKIES" > "$cookie_file"
            args+=(--cookies "$cookie_file")
          fi

          yt-dlp "${args[@]}" "$VIDEO_URL"

          python -c "from pathlib import Path; import zipfile; video = Path('video.mp4'); assert video.is_file() and video.stat().st_size > 0, 'Downloaded video is missing or empty'; archive = zipfile.ZipFile('video.zip', 'w', compression=zipfile.ZIP_STORED); archive.write(video, arcname=video.name); archive.close(); video.unlink()"

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: youtube-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" video.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "YouTube video $RELEASE_TAG" \
            --notes "Video downloaded by GitHub Actions run $GITHUB_RUN_ID."
